name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Comments, tests and docs describe behaviour, not the process around it: no issue-draft names,
      # planning paths, cycle numbers, tracker ids or local paths.
      - run: pnpm check:public-text
      # Bare RangeError throws may only decrease: new guards throw InputRangeError with their facts.
      - run: pnpm check:coded-refusals
      - run: pnpm build
      # Runs the built library on degenerate inputs harvested from the tests; any NaN/Infinity
      # output that ERRORS.md does not document as a sentinel fails the build.
      - run: pnpm check:nonfinite-outputs
      - run: pnpm check:nonfinite-inputs
      # Every function ERRORS.md documents as `throw` has a test that sees it throw.
      - run: pnpm check:documented-throws
      # README examples type-check against dist/ and print what their comments say.
      - run: pnpm check:readme-examples
      - run: pnpm test:coverage
