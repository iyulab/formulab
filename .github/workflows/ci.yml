name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Runs the built library on degenerate inputs harvested from the tests; any NaN/Infinity
      # output that ERRORS.md does not document as a sentinel fails the build.
      - run: pnpm check:nonfinite-outputs
      - run: pnpm test:coverage
